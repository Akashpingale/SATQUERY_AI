[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-backend"
version = "0.1.0"
description = "SatQuery AI backend - agentic remote-sensing analysis API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    # Geospatial raster stack (Phase 2). Rasterio wheels bundle GDAL, so no
    # system GDAL install is required on Windows or in slim Linux images.
    "rasterio>=1.3",
    "numpy>=1.26",
    "pyproj>=3.6",
    "shapely>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Local dev/tests use SQLite and do not need a Postgres driver.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Installed in Docker / when talking to PostgreSQL.
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "BLE"]
ignore = ["B008"]  # FastAPI uses callables in argument defaults (Depends)

[tool.ruff.lint.per-file-ignores]
# conftest intentionally sets environment variables before importing the app,
# so its import block is not isort-orderable.
"tests/conftest.py" = ["I001"]
